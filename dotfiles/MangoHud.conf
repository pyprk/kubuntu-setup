# Hidden at launch; Right Shift + F12 toggles the overlay.
no_display
toggle_hud=Shift_R+F12

# Frame limiter: Left Shift + F1 cycles through these values (0 = unlimited).
# Add your main monitor's refresh rate here, e.g. fps_limit=0,144,72
fps_limit=0,60,75
toggle_fps_limit=Shift_L+F1
fps_limit_method=late

position=top-left
fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
ram
vram
gamemode
